# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: Scan for hardcoded secrets

  - repo: local
    hooks:
      - id: helm-docs
        name: helm-docs
        entry: make -C box/kubernetes/charts docs
        language: system
        files: 'box/kubernetes/.*\.(yaml|tpl|gotmpl)$'
        pass_filenames: false
      - id: resume-pdf
        name: resume-pdf
        entry: make -C notes/resume pdf
        language: system
        files: '^notes/resume/resume\.html$'
        pass_filenames: false
