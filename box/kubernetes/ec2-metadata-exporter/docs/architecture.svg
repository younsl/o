<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" width="1200" height="570" role="img" aria-label="Prometheus scrapes the ec2-metadata-exporter Pod inside the EKS cluster and receives seven ec2_metadata series; the Pod polls the EC2 DescribeInstances API every 60 seconds and receives per-instance attributes such as instance id, Name tag, private IP, type, availability zone, state, lifecycle and architecture." font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6dade"/>
    </marker>
    <marker id="a-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c848c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="570" fill="#0a0a0b"/>

  <!-- boundaries -->
  <text x="30" y="36" fill="#6f767d" font-size="11.5" letter-spacing="1.6">EKS CLUSTER</text>
  <rect x="30" y="50" width="730" height="180" rx="10" fill="none" stroke="#33383e" stroke-dasharray="6 5"/>

  <text x="840" y="36" fill="#6f767d" font-size="11.5" letter-spacing="1.6">AWS</text>
  <rect x="840" y="50" width="330" height="180" rx="10" fill="none" stroke="#33383e" stroke-dasharray="6 5"/>

  <!-- components -->
  <rect x="60" y="80" width="240" height="120" rx="6" fill="#17191c" stroke="#474d54"/>
  <text x="84" y="130" fill="#e6e9ec" font-size="14">Prometheus</text>
  <text x="84" y="155" fill="#8d949b" font-size="11">namespace monitoring</text>

  <rect x="490" y="80" width="240" height="120" rx="6" fill="#17191c" stroke="#474d54"/>
  <text x="514" y="125" fill="#e6e9ec" font-size="14">ec2-metadata-exporter</text>
  <text x="514" y="148" fill="#8d949b" font-size="11">Pod, 1 replica</text>
  <text x="514" y="168" fill="#8d949b" font-size="11">in-memory snapshot</text>

  <rect x="870" y="80" width="270" height="120" rx="6" fill="#17191c" stroke="#474d54"/>
  <text x="894" y="130" fill="#e6e9ec" font-size="14">EC2 API</text>
  <text x="894" y="155" fill="#8d949b" font-size="11">DescribeInstances</text>

  <!-- edges -->
  <line x1="300" y1="118" x2="484" y2="118" stroke="#d6dade" marker-end="url(#a)"/>
  <text x="392" y="106" fill="#a8afb6" font-size="10.5" text-anchor="middle">GET :8081/metrics, 30s</text>

  <line x1="484" y1="162" x2="306" y2="162" stroke="#7c848c" stroke-dasharray="5 4" marker-end="url(#a-dim)"/>
  <text x="392" y="180" fill="#8d949b" font-size="10.5" text-anchor="middle">7 series</text>

  <line x1="730" y1="118" x2="864" y2="118" stroke="#d6dade" marker-end="url(#a)"/>
  <text x="797" y="106" fill="#a8afb6" font-size="10.5" text-anchor="middle">poll, 60s</text>

  <line x1="864" y1="162" x2="736" y2="162" stroke="#7c848c" stroke-dasharray="5 4" marker-end="url(#a-dim)"/>
  <text x="797" y="180" fill="#8d949b" font-size="10.5" text-anchor="middle">instances</text>

  <!-- data: metrics -->
  <rect x="60" y="280" width="510" height="230" rx="8" fill="#101113" stroke="#2b3036"/>
  <text x="84" y="312" fill="#6f767d" font-size="10.5" letter-spacing="1.4">SERVED ON :8081/metrics</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#c3c9cf">
    <text x="84" y="348">ec2_metadata_instance_info</text>
    <text x="84" y="370">ec2_metadata_instance_launch_time_seconds</text>
    <text x="84" y="392">ec2_metadata_instances</text>
    <text x="84" y="414">ec2_metadata_scrape_errors_total</text>
    <text x="84" y="436">ec2_metadata_scrape_duration_seconds</text>
    <text x="84" y="458">ec2_metadata_last_scrape_success_timestamp_seconds</text>
    <text x="84" y="480">ec2_metadata_build_info</text>
  </g>

  <!-- data: ec2 attributes -->
  <rect x="630" y="280" width="510" height="230" rx="8" fill="#101113" stroke="#2b3036"/>
  <text x="654" y="312" fill="#6f767d" font-size="10.5" letter-spacing="1.4">READ FROM DescribeInstances</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#c3c9cf">
    <text x="654" y="344">instance_id</text>
    <text x="654" y="364">name</text>
    <text x="654" y="384">private_ip</text>
    <text x="654" y="404">instance_type</text>
    <text x="654" y="424">availability_zone</text>
    <text x="654" y="444">state</text>
    <text x="654" y="464">lifecycle</text>
    <text x="654" y="484">architecture</text>
  </g>
  <g font-size="10" fill="#7c848c">
    <text x="830" y="344">i-0abc123</text>
    <text x="830" y="364">Name tag</text>
    <text x="830" y="384">10.0.1.10</text>
    <text x="830" y="404">m5.large</text>
    <text x="830" y="424">ap-northeast-2a</text>
    <text x="830" y="444">running, stopped</text>
    <text x="830" y="464">on-demand, spot</text>
    <text x="830" y="484">x86_64, arm64</text>
  </g>
</svg>
