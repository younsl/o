<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 590" width="980" height="590" role="img" aria-label="Stale Branches plugin architecture">
  <defs>
    <style>
      .bg { fill: #0b0b0c; }
      .card { fill: #141518; stroke: #2b2d31; stroke-width: 1; }
      .zone { fill: none; stroke: #232529; stroke-width: 1; stroke-dasharray: 4 4; }
      .store { fill: #101113; stroke: #26282c; stroke-width: 1; }
      .t { fill: #d3d6da; font-size: 12px; font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .s { fill: #7f858e; font-size: 10.5px; font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .lbl { fill: #62676e; font-size: 10.5px; letter-spacing: .08em; font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .h { fill: #e8eaed; font-size: 15px; font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; fill: #9aa0a8; }
      .ln { stroke: #40444a; stroke-width: 1; fill: none; }
      .ln-d { stroke: #40444a; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
    </style>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#40444a"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="590"/>

  <text class="h" x="40" y="42">Stale Branches architecture</text>
  <text class="s" x="40" y="62">One GitLab connection, many schedules, one run record per execution</text>

  <!-- backend zone -->
  <rect class="zone" x="280" y="92" width="400" height="376" rx="10"/>
  <text class="lbl" x="296" y="112">STALE-BRANCHES-BACKEND</text>

  <!-- left column -->
  <rect class="card" x="40" y="126" width="190" height="52" rx="6"/>
  <text class="t" x="56" y="150">Frontend plugin</text>
  <text class="s" x="56" y="166">schedules, runs, connection form</text>

  <rect class="card" x="40" y="192" width="190" height="52" rx="6"/>
  <text class="t" x="56" y="216">app-config.yaml</text>
  <text class="s" x="56" y="232">integrations.gitlab, allowedHosts</text>

  <rect class="card" x="40" y="258" width="190" height="52" rx="6"/>
  <text class="t" x="56" y="282">Scheduler tick</text>
  <text class="s" x="56" y="298">every 60s, cron read per schedule</text>

  <!-- backend boxes -->
  <rect class="card" x="300" y="126" width="360" height="52" rx="6"/>
  <text class="t" x="318" y="150">Router</text>
  <text class="s" x="318" y="166">admin gated REST, write-only secrets</text>

  <rect class="card" x="300" y="192" width="360" height="52" rx="6"/>
  <text class="t" x="318" y="216">Allow list resolve</text>
  <text class="s" x="318" y="232">request picks a target, config names it</text>

  <rect class="card" x="300" y="258" width="360" height="52" rx="6"/>
  <text class="t" x="318" y="282">StaleBranchesService</text>
  <text class="s" x="318" y="298">resolve projects, age branch tips, record run</text>

  <rect class="card" x="300" y="324" width="360" height="52" rx="6"/>
  <text class="t" x="318" y="348">GitlabClient</text>
  <text class="s" x="318" y="364">20 rps, paged reads, global pause on 429</text>

  <rect class="card" x="300" y="390" width="360" height="52" rx="6"/>
  <text class="t" x="318" y="414">SlackNotifier</text>
  <text class="s" x="318" y="430">one message per branch, deduped per tip commit</text>

  <!-- right column -->
  <rect class="card" x="740" y="324" width="200" height="52" rx="6"/>
  <text class="t" x="756" y="348">GitLab API</text>
  <text class="s" x="756" y="364">branches, tip commits</text>

  <rect class="card" x="740" y="390" width="200" height="52" rx="6"/>
  <text class="t" x="756" y="414">Slack webhook</text>
  <text class="s" x="756" y="430">per schedule, paced ~1s apart</text>

  <!-- storage -->
  <rect class="zone" x="40" y="492" width="900" height="72" rx="10"/>
  <text class="lbl" x="56" y="512">BACKSTAGE DATABASE</text>
  <rect class="store" x="56" y="520" width="205" height="30" rx="5"/>
  <text class="mono" x="70" y="540">stale_branches_connection</text>
  <rect class="store" x="277" y="520" width="205" height="30" rx="5"/>
  <text class="mono" x="291" y="540">stale_branches_schedules</text>
  <rect class="store" x="498" y="520" width="205" height="30" rx="5"/>
  <text class="mono" x="512" y="540">stale_branches_runs</text>
  <rect class="store" x="719" y="520" width="205" height="30" rx="5"/>
  <text class="mono" x="733" y="540">stale_branches_notified</text>

  <!-- edges -->
  <path class="ln" d="M230 152 H300" marker-end="url(#a)"/>
  <path class="ln-d" d="M230 218 H300" marker-end="url(#a)"/>
  <path class="ln-d" d="M230 284 H300" marker-end="url(#a)"/>
  <path class="ln" d="M480 178 V192" marker-end="url(#a)"/>
  <path class="ln" d="M480 244 V258" marker-end="url(#a)"/>
  <path class="ln" d="M480 310 V324" marker-end="url(#a)"/>
  <path class="ln" d="M480 376 V390" marker-end="url(#a)"/>
  <path class="ln" d="M660 350 H740" marker-end="url(#a)"/>
  <path class="ln" d="M660 416 H740" marker-end="url(#a)"/>
  <path class="ln" d="M480 442 V492" marker-end="url(#a)"/>

  <text class="s" x="243" y="146">REST</text>
  <text class="s" x="243" y="212">config</text>
  <text class="s" x="243" y="278">tick</text>
  <text class="s" x="490" y="466">runs, schedules, connection, dedupe log</text>
</svg>
