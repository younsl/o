<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6e6e"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a4a"/>
    </marker>
  </defs>

  <rect width="910" height="360" fill="#0a0a0a"/>

  <text x="30" y="30" fill="#8b8b8b" font-size="12">aws-health-event-notifier, pull model</text>

  <!-- AWS boundary -->
  <g>
    <rect x="30" y="56" width="230" height="250" rx="8" fill="#0e0e0e" stroke="#3a3a3a" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="46" y="78" fill="#6e6e6e" font-size="11">AWS account</text>
  </g>

  <!-- Kubernetes cluster boundary -->
  <g>
    <rect x="380" y="56" width="280" height="250" rx="8" fill="#0e0e0e" stroke="#3a3a3a" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="396" y="78" fill="#6e6e6e" font-size="11">Kubernetes cluster</text>
  </g>

  <!-- flows -->
  <g stroke="#6e6e6e" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
    <path d="M 238 152 H 396"/>
    <path d="M 636 152 H 712"/>
  </g>
  <g stroke="#4a4a4a" stroke-width="1.2" fill="none" stroke-dasharray="4 4" marker-end="url(#arrow-dim)">
    <path d="M 520 184 V 218"/>
  </g>

  <!-- flow labels -->
  <g font-size="11">
    <text x="321" y="140" text-anchor="middle" fill="#8b8b8b">DescribeEvents</text>
    <text x="321" y="174" text-anchor="middle" fill="#6e6e6e">60s interval</text>
    <text x="674" y="142" text-anchor="middle" fill="#8b8b8b">webhook</text>
    <text x="532" y="209" fill="#6e6e6e">emit</text>
  </g>

  <!-- AWS Health API -->
  <g>
    <rect x="52" y="120" width="186" height="64" rx="6" fill="#141414" stroke="#3a3a3a"/>
    <text x="145" y="148" text-anchor="middle" fill="#e8e8e8" font-size="13">AWS Health API</text>
    <text x="145" y="167" text-anchor="middle" fill="#7a7a7a" font-size="10">global, us-east-1 endpoint</text>
  </g>

  <!-- notifier pod -->
  <g>
    <rect x="404" y="120" width="232" height="64" rx="6" fill="#141414" stroke="#3a3a3a"/>
    <image x="414" y="134" width="37" height="36" href="data:image/png;base64,"/>
    <text x="545" y="148" text-anchor="middle" fill="#e8e8e8" font-size="13">notifier Pod</text>
    <text x="545" y="167" text-anchor="middle" fill="#7a7a7a" font-size="10">poll, dedup, filter, format</text>
  </g>

  <!-- Kubernetes Event -->
  <g>
    <rect x="404" y="226" width="232" height="56" rx="6" fill="#111111" stroke="#2e2e2e"/>
    <text x="520" y="250" text-anchor="middle" fill="#c8c8c8" font-size="12">Kubernetes Event</text>
    <text x="520" y="268" text-anchor="middle" fill="#6e6e6e" font-size="10">on own Pod, best effort</text>
  </g>

  <!-- Slack -->
  <g>
    <rect x="720" y="120" width="160" height="64" rx="6" fill="#141414" stroke="#3a3a3a"/>
    <text x="800" y="148" text-anchor="middle" fill="#e8e8e8" font-size="13">Slack</text>
    <text x="800" y="167" text-anchor="middle" fill="#7a7a7a" font-size="10">incoming webhook</text>
  </g>

  <!-- IRSA / Pod Identity note -->
  <text x="145" y="290" text-anchor="middle" fill="#5a5a5a" font-size="10">IRSA / EKS Pod Identity</text>
</svg>
