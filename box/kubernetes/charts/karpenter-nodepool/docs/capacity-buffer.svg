<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 380" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6e6e"/>
    </marker>
  </defs>

  <rect width="1040" height="380" fill="#0a0a0a"/>

  <text x="30" y="34" fill="#e8e8e8" font-size="15">CapacityBuffer</text>
  <text x="30" y="52" fill="#6e6e6e" font-size="11">declared headroom, kept warm by virtual pods</text>

  <!-- karpenter boundary -->
  <rect x="262" y="88" width="486" height="124" rx="8" fill="#0e0e0e" stroke="#3a3a3a" stroke-dasharray="5 4"/>
  <text x="278" y="106" fill="#6e6e6e" font-size="10">karpenter</text>

  <!-- flow -->
  <g stroke="#6e6e6e" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
    <path d="M 230 156 H 280"/>
    <path d="M 480 156 H 530"/>
    <path d="M 730 156 H 780"/>
    <path d="M 880 202 V 244"/>
  </g>
  <g stroke="#4a4a4a" stroke-width="1.2" fill="none" stroke-dasharray="4 4" marker-end="url(#arrow)">
    <path d="M 780 276 H 380 V 202"/>
  </g>
  <text x="580" y="292" text-anchor="middle" fill="#6e6e6e" font-size="10">refill</text>

  <!-- boxes -->
  <rect x="30" y="116" width="200" height="80" rx="6" fill="#0d1b2a" stroke="#58a6ff" stroke-width="1.6"/>
  <text x="130" y="142" text-anchor="middle" fill="#cfe6ff" font-size="13">CapacityBuffer</text>
  <text x="130" y="162" text-anchor="middle" fill="#6e8ba6" font-size="10">autoscaling.x-k8s.io/v1alpha1</text>
  <text x="130" y="178" text-anchor="middle" fill="#6e8ba6" font-size="10">replicas or percentage</text>

  <rect x="280" y="116" width="200" height="80" rx="6" fill="#141414" stroke="#3a3a3a"/>
  <text x="380" y="142" text-anchor="middle" fill="#e8e8e8" font-size="13">buffer controller</text>
  <text x="380" y="162" text-anchor="middle" fill="#7a7a7a" font-size="10">resolves ref to pod shape</text>
  <text x="380" y="178" text-anchor="middle" fill="#7a7a7a" font-size="10">virtual pods, in memory</text>

  <rect x="530" y="116" width="200" height="80" rx="6" fill="#141414" stroke="#3a3a3a"/>
  <text x="630" y="142" text-anchor="middle" fill="#e8e8e8" font-size="13">provisioner</text>
  <text x="630" y="162" text-anchor="middle" fill="#7a7a7a" font-size="10">solves real + virtual pods</text>
  <text x="630" y="178" text-anchor="middle" fill="#7a7a7a" font-size="10">NodeClaim per buffer slot</text>

  <rect x="780" y="116" width="200" height="80" rx="6" fill="#141414" stroke="#3a3a3a"/>
  <text x="880" y="142" text-anchor="middle" fill="#e8e8e8" font-size="13">warm Node</text>
  <text x="880" y="162" text-anchor="middle" fill="#7a7a7a" font-size="10">allocatable kept free</text>
  <text x="880" y="178" text-anchor="middle" fill="#7a7a7a" font-size="10">consolidation blocked</text>

  <rect x="780" y="244" width="200" height="64" rx="6" fill="#141414" stroke="#3a3a3a"/>
  <text x="880" y="270" text-anchor="middle" fill="#e8e8e8" font-size="13">real pod binds</text>
  <text x="880" y="290" text-anchor="middle" fill="#7a7a7a" font-size="10">no preempt, no launch wait</text>

  <text x="30" y="348" fill="#6e6e6e" font-size="10.5">Alpha in Karpenter 1.14, same CRD as cluster-autoscaler 1.34. Headroom shows in CapacityBuffer status, not in kubectl get pods.</text>
</svg>
