{{- include "argocd-promotion-gate.certs" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-tls" (include "argocd-promotion-gate.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "argocd-promotion-gate.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.generatedCerts.cert }}
  tls.key: {{ .Values.generatedCerts.key }}
  # Kept alongside the pair so an upgrade can reuse the whole set instead of
  # minting a new CA the API server has not been told about.
  ca.crt: {{ .Values.generatedCerts.ca }}
