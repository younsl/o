{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "argocd-promotion-gate.fullname" . }}
  namespace: {{ .Values.gate.argocd.namespace }}
  labels:
    {{- include "argocd-promotion-gate.labels" . | nindent 4 }}
rules:
  # Read-only, and only Applications. The gate never writes: enforcement is the
  # admission response, not a mutation.
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    verbs:
      - get
      - list
      - watch
{{- end }}
