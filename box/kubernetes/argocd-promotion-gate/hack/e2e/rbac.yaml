# Exists only so the exempt-principal test can reach admission.
#
# A real cluster has Argo CD's own RBAC for this service account. Here there is
# no Argo CD, so an impersonated request would be refused by authorization
# before the webhook is ever consulted, and the test would pass for the wrong
# reason.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: e2e-argocd-application-controller
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    verbs:
      - get
      - list
      - watch
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: e2e-argocd-application-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: e2e-argocd-application-controller
subjects:
  - kind: ServiceAccount
    name: argocd-application-controller
    namespace: argocd
