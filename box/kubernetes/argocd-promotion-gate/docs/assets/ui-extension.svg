<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="580" fill="#ffffff"/>

  <!-- lane 1: delivery -->
  <rect x="40" y="56" width="820" height="140" rx="10" fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="64" y="82" font-size="14" font-weight="600" fill="#111111">Install &#183; how the script reaches the browser</text>

  <rect x="64" y="100" width="200" height="68" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="164" y="128" font-size="13.5" font-weight="600" fill="#111111" text-anchor="middle">gate binary</text>
  <text x="164" y="148" font-size="11.5" fill="#6b6b6b" text-anchor="middle">extension.js via go:embed</text>

  <rect x="340" y="100" width="200" height="68" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="440" y="128" font-size="13.5" font-weight="600" fill="#111111" text-anchor="middle">init container</text>
  <text x="440" y="148" font-size="11.5" fill="#6b6b6b" text-anchor="middle">argocd-extension-installer</text>

  <rect x="616" y="100" width="220" height="68" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="726" y="128" font-size="13.5" font-weight="600" fill="#111111" text-anchor="middle">argocd-server</text>
  <text x="726" y="148" font-size="11.5" fill="#6b6b6b" text-anchor="middle">extensions volume, served static</text>

  <path d="M 264 134 L 340 134" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="302" y="126" font-size="11" fill="#6b6b6b" text-anchor="middle">extension.tar</text>

  <path d="M 540 134 L 616 134" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="578" y="126" font-size="11" fill="#6b6b6b" text-anchor="middle">unpacks</text>

  <!-- delivery into the browser -->
  <path d="M 726 168 L 726 232 L 149 232 L 149 348" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="224" font-size="11.5" fill="#6b6b6b" text-anchor="middle">the SPA loads the script, which registers a status panel extension</text>

  <!-- lane 2: runtime -->
  <rect x="40" y="290" width="820" height="250" rx="10" fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="64" y="316" font-size="14" font-weight="600" fill="#111111">Runtime &#183; how the tile gets its verdict</text>

  <rect x="64" y="348" width="170" height="76" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="149" y="378" font-size="13.5" font-weight="600" fill="#111111" text-anchor="middle">browser</text>
  <text x="149" y="398" font-size="11.5" fill="#6b6b6b" text-anchor="middle">Application status panel</text>

  <rect x="330" y="348" width="200" height="76" rx="6" fill="#f4f4f4" stroke="#111111" stroke-width="1.5"/>
  <text x="430" y="378" font-size="13.5" font-weight="600" fill="#111111" text-anchor="middle">argocd-server proxy</text>
  <text x="430" y="398" font-size="11.5" fill="#6b6b6b" text-anchor="middle">Argo CD RBAC check</text>

  <rect x="650" y="348" width="186" height="76" rx="6" fill="#111111" stroke="#111111" stroke-width="1.5"/>
  <text x="743" y="378" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="middle">gate extension API</text>
  <text x="743" y="398" font-size="11.5" fill="#bdbdbd" text-anchor="middle">:8080 &#183; the webhook engine</text>

  <path d="M 234 386 L 330 386" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="282" cy="364" r="11" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="282" y="368" font-size="11.5" font-weight="600" fill="#111111" text-anchor="middle">1</text>

  <path d="M 530 386 L 650 386" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="590" cy="364" r="11" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="590" y="368" font-size="11.5" font-weight="600" fill="#111111" text-anchor="middle">2</text>

  <path d="M 743 424 L 743 452 L 149 452 L 149 424" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="446" cy="452" r="11" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="446" y="456" font-size="11.5" font-weight="600" fill="#111111" text-anchor="middle">3</text>

  <text x="64" y="490" font-size="11.5" font-weight="600" fill="#111111">1</text>
  <text x="80" y="490" font-size="11.5" fill="#6b6b6b">GET /extensions/promotion-gate/api/v1/gate, sending Argocd-Application-Name and Argocd-Project-Name</text>
  <text x="64" y="510" font-size="11.5" font-weight="600" fill="#111111">2</text>
  <text x="80" y="510" font-size="11.5" fill="#6b6b6b">argocd-server authorizes invoke on the extensions resource, then forwards to the service</text>
  <text x="64" y="530" font-size="11.5" font-weight="600" fill="#111111">3</text>
  <text x="80" y="530" font-size="11.5" fill="#6b6b6b">the same verdict the webhook would return, rendered as Ready, Blocked, Tag mismatch, Exempt, or Unknown</text>
</svg>
