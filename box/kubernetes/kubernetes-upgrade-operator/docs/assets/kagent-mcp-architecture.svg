<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6e6e"/>
    </marker>
  </defs>

  <rect width="1000" height="460" fill="#0a0a0a"/>

  <text x="32" y="44" fill="#e8e8e8" font-size="18">kuo MCP server</text>
  <text x="32" y="66" fill="#6e6e6e" font-size="11">kagent asks, kuo answers with verdicts. Streamable HTTP, stateless, bearer-authenticated</text>

  <!-- hub cluster boundary -->
  <rect x="24" y="88" width="656" height="344" rx="8" fill="#0e0e0e" stroke="#3a3a3a" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="40" y="108" fill="#6e6e6e" font-size="11">Kubernetes cluster (hub)</text>

  <!-- kagent -->
  <rect x="48" y="136" width="232" height="128" rx="6" fill="#161616" stroke="#5a5a5a"/>
  <text x="64" y="160" fill="#e8e8e8" font-size="12">kagent (ns: kagent)</text>
  <text x="64" y="182" fill="#8a8a8a" font-size="10">Agent CR: toolNames</text>
  <text x="64" y="198" fill="#8a8a8a" font-size="10">RemoteMCPServer CR:</text>
  <text x="64" y="212" fill="#8a8a8a" font-size="10">  kuo.kuo.svc:8082/mcp</text>
  <text x="64" y="230" fill="#8a8a8a" font-size="10">Secret kuo-mcp-token</text>
  <text x="64" y="246" fill="#6e6e6e" font-size="10">tools/list, tools/call</text>

  <!-- kuo pod -->
  <rect x="368" y="136" width="288" height="220" rx="6" fill="#161616" stroke="#5a5a5a"/>
  <text x="384" y="160" fill="#e8e8e8" font-size="12">kuo Pod (ns: kuo)</text>
  <text x="384" y="178" fill="#6e6e6e" font-size="10">:8080 health  :8081 metrics  :8082 mcp</text>

  <rect x="380" y="190" width="264" height="76" rx="4" fill="#2a2a2a" stroke="#8a8a8a"/>
  <text x="394" y="208" fill="#f0f0f0" font-size="11">mcp module</text>
  <text x="394" y="224" fill="#8a8a8a" font-size="10">read tools x12</text>
  <text x="394" y="238" fill="#8a8a8a" font-size="10">mutating tools x3, audit + Slack notify</text>
  <text x="394" y="252" fill="#8a8a8a" font-size="10">bearer auth, TTL cache 30s</text>

  <rect x="380" y="276" width="264" height="46" rx="4" fill="#1d1d1d" stroke="#4a4a4a"/>
  <text x="394" y="294" fill="#d4d4d4" font-size="11">controller (reconcile loop)</text>
  <text x="394" y="310" fill="#8a8a8a" font-size="10">same clients, same resolve path</text>

  <text x="384" y="342" fill="#6e6e6e" font-size="10">shared: eks:: k8s:: crd:: render::</text>

  <!-- EKSUpgrades, stacked -->
  <rect x="378" y="374" width="288" height="40" rx="4" fill="#141414" stroke="#3a3a3a"/>
  <rect x="373" y="379" width="288" height="40" rx="4" fill="#171717" stroke="#424242"/>
  <rect x="368" y="384" width="288" height="40" rx="4" fill="#1a1a1a" stroke="#4a4a4a"/>
  <text x="384" y="409" fill="#d4d4d4" font-size="12">EKSUpgrades (CRs)  <tspan fill="#6e6e6e" font-size="10">one per cluster</tspan></text>

  <!-- outside: AWS -->
  <rect x="720" y="136" width="248" height="112" rx="6" fill="#121212" stroke="#3a3a3a" stroke-dasharray="5 4"/>
  <text x="736" y="160" fill="#d4d4d4" font-size="12">AWS EKS API</text>
  <text x="736" y="182" fill="#8a8a8a" font-size="10">assumed role (STS)</text>
  <text x="736" y="200" fill="#6e6e6e" font-size="10">insights, addon compatibility,</text>
  <text x="736" y="216" fill="#6e6e6e" font-size="10">nodegroups, version lifecycle</text>

  <!-- outside: target cluster -->
  <rect x="720" y="280" width="248" height="112" rx="6" fill="#121212" stroke="#3a3a3a" stroke-dasharray="5 4"/>
  <text x="736" y="304" fill="#d4d4d4" font-size="12">target cluster (spoke)</text>
  <text x="736" y="326" fill="#8a8a8a" font-size="10">read-only via resolve_client</text>
  <text x="736" y="344" fill="#6e6e6e" font-size="10">NodeClaims, NodePools, PDBs,</text>
  <text x="736" y="360" fill="#6e6e6e" font-size="10">Node kubelet versions</text>

  <!-- flows -->
  <g stroke="#6e6e6e" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
    <path d="M 280 200 H 362"/>
    <path d="M 512 356 V 368"/>
    <path d="M 656 210 H 714"/>
    <path d="M 656 300 H 690 V 336 H 714"/>
  </g>

  <!-- flow labels -->
  <text x="288" y="192" fill="#8a8a8a" font-size="10">POST /mcp</text>
  <text x="296" y="214" fill="#6e6e6e" font-size="10">bearer</text>
  <text x="520" y="372" fill="#6e6e6e" font-size="10">read / patch, never AWS directly</text>
</svg>
