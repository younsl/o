<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6e6e"/>
    </marker>
  </defs>

  <rect width="1000" height="720" fill="#0a0a0a"/>

  <text x="32" y="44" fill="#e8e8e8" font-size="18">kubernetes-upgrade-operator</text>
  <text x="32" y="66" fill="#6e6e6e" font-size="11">EKSUpgrade reconcile loop, Slack notifications, Grafana annotations</text>

  <!-- kubernetes cluster boundary -->
  <g>
    <rect x="24" y="88" width="672" height="580" rx="8" fill="#0e0e0e" stroke="#3a3a3a" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="40" y="108" fill="#6e6e6e" font-size="11">Kubernetes cluster</text>
  </g>

  <!-- flows -->
  <g stroke="#6e6e6e" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
    <path d="M 132 180 V 242"/>
    <path d="M 208 248 V 186"/>
    <path d="M 280 272 H 344"/>
    <path d="M 352 300 H 288"/>
    <path d="M 576 286 H 728"/>
    <path d="M 280 316 H 316 V 594 H 344"/>
    <path d="M 316 402 H 344"/>
    <path d="M 576 402 H 728"/>
    <path d="M 576 594 H 728"/>
    <path d="M 168 580 V 538"/>
  </g>

  <!-- module dependency edges -->
  <g stroke="#4a4a4a" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)">
    <path d="M 464 432 V 462"/>
    <path d="M 464 564 V 534"/>
  </g>

  <circle cx="316" cy="402" r="2.5" fill="#6e6e6e"/>

  <g fill="#8b8b8b" font-size="11">
    <text x="124" y="216" text-anchor="end">watch</text>
    <text x="216" y="216">patch status</text>
    <text x="312" y="262" text-anchor="middle">dispatch</text>
    <text x="312" y="320" text-anchor="middle">result</text>
    <text x="652" y="276" text-anchor="middle">describe / update</text>
    <text x="308" y="430" text-anchor="end">on phase</text>
    <text x="308" y="444" text-anchor="end">transition</text>
    <text x="652" y="392" text-anchor="middle">webhook POST</text>
    <text x="652" y="584" text-anchor="middle">POST /api/annotations</text>
    <text x="178" y="560">scrape /metrics</text>
    <text x="476" y="452" fill="#5e5e5e" font-size="10">uses</text>
    <text x="476" y="552" fill="#5e5e5e" font-size="10">uses</text>
  </g>

  <!-- nodes: left column -->
  <g>
    <rect x="56" y="118" width="224" height="62" rx="6" fill="#141414" stroke="#3a3a3a"/>
    <text x="168" y="146" text-anchor="middle" fill="#e8e8e8" font-size="14">EKSUpgrade</text>
    <text x="168" y="166" text-anchor="middle" fill="#7a7a7a" font-size="11">kuo.io/v1alpha1 custom resource</text>

    <rect x="56" y="248" width="224" height="76" rx="6" fill="#141414" stroke="#3a3a3a"/>
    <text x="168" y="276" text-anchor="middle" fill="#e8e8e8" font-size="14">controller.rs</text>
    <text x="168" y="296" text-anchor="middle" fill="#7a7a7a" font-size="11">reconcile loop, phase</text>
    <text x="168" y="312" text-anchor="middle" fill="#7a7a7a" font-size="11">transition side effects</text>

    <rect x="56" y="470" width="224" height="62" rx="6" fill="#141414" stroke="#3a3a3a"/>
    <text x="168" y="498" text-anchor="middle" fill="#e8e8e8" font-size="14">telemetry.rs</text>
    <text x="168" y="518" text-anchor="middle" fill="#7a7a7a" font-size="11">/metrics /healthz /readyz</text>

    <rect x="56" y="580" width="224" height="62" rx="6" fill="#141414" stroke="#3a3a3a"/>
    <text x="168" y="608" text-anchor="middle" fill="#e8e8e8" font-size="14">Prometheus</text>
    <text x="168" y="628" text-anchor="middle" fill="#7a7a7a" font-size="11">ServiceMonitor</text>
  </g>

  <!-- nodes: middle column -->
  <g>
    <rect x="352" y="248" width="224" height="88" rx="6" fill="#141414" stroke="#3a3a3a"/>
    <text x="464" y="274" text-anchor="middle" fill="#e8e8e8" font-size="14">phases.rs</text>
    <text x="464" y="294" text-anchor="middle" fill="#7a7a7a" font-size="11">planning, preflight, control</text>
    <text x="464" y="310" text-anchor="middle" fill="#7a7a7a" font-size="11">plane, addons, nodegroups,</text>
    <text x="464" y="326" text-anchor="middle" fill="#7a7a7a" font-size="11">karpenter (eks.rs, k8s.rs)</text>

    <rect x="352" y="372" width="224" height="60" rx="6" fill="#141414" stroke="#3a3a3a"/>
    <text x="464" y="398" text-anchor="middle" fill="#e8e8e8" font-size="14">notify.rs</text>
    <text x="464" y="418" text-anchor="middle" fill="#7a7a7a" font-size="11">slack message builder</text>

    <rect x="352" y="468" width="224" height="60" rx="6" fill="#141414" stroke="#8b8b8b"/>
    <text x="464" y="494" text-anchor="middle" fill="#e8e8e8" font-size="14">render.rs</text>
    <text x="464" y="514" text-anchor="middle" fill="#7a7a7a" font-size="11">path / mode / duration</text>

    <rect x="352" y="564" width="224" height="60" rx="6" fill="#141414" stroke="#8b8b8b"/>
    <text x="464" y="590" text-anchor="middle" fill="#e8e8e8" font-size="14">annotate.rs</text>
    <text x="464" y="610" text-anchor="middle" fill="#7a7a7a" font-size="11">marker policy + client</text>
  </g>

  <!-- nodes: external -->
  <g>
    <rect x="736" y="248" width="232" height="88" rx="6" fill="#141414" stroke="#3a3a3a"/>
    <text x="852" y="284" text-anchor="middle" fill="#e8e8e8" font-size="14">AWS EKS API</text>
    <text x="852" y="304" text-anchor="middle" fill="#7a7a7a" font-size="11">cluster, addon, nodegroup,</text>
    <text x="852" y="320" text-anchor="middle" fill="#7a7a7a" font-size="11">insights, sts</text>

    <rect x="736" y="372" width="232" height="60" rx="6" fill="#141414" stroke="#3a3a3a"/>
    <text x="852" y="398" text-anchor="middle" fill="#e8e8e8" font-size="14">Slack</text>
    <text x="852" y="418" text-anchor="middle" fill="#7a7a7a" font-size="11">incoming webhook</text>

    <rect x="736" y="564" width="232" height="60" rx="6" fill="#141414" stroke="#8b8b8b"/>
    <text x="852" y="590" text-anchor="middle" fill="#e8e8e8" font-size="14">Grafana</text>
    <text x="852" y="610" text-anchor="middle" fill="#7a7a7a" font-size="11">annotations API, dashboards</text>
  </g>

  <!-- legend -->
  <g>
    <rect x="736" y="668" width="28" height="16" rx="3" fill="#141414" stroke="#8b8b8b"/>
    <text x="772" y="681" fill="#6e6e6e" font-size="10">added in this change</text>
  </g>
</svg>
