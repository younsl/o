    #       annotations:
    #         summary: "EKS upgrade stuck for {{ $labels.cluster_name }}"
    #         description: "Cluster {{ $labels.cluster_name }} has been in {{ $labels.phase }} phase for over 60 minutes."

# -- (string) Pod priority class name. Defaults to `system-cluster-critical` so the operator is protected from preemption. Empty uses the Kubernetes default.
priorityClassName: system-cluster-critical

# -- (string) Pod DNS policy. One of `ClusterFirst`, `ClusterFirstWithHostNet`, `Default`, or `None`. Empty uses the Kubernetes default.
dnsPolicy: ""

# -- (object) Pod DNS config. Required when dnsPolicy is `None`. See PodDNSConfig spec (nameservers, searches, options).
dnsConfig: {}

# -- (object) Node selector for pod scheduling.
nodeSelector: {}
# -- (list) Tolerations for pod scheduling.
tolerations: []
# -- (object) Affinity rules for pod scheduling.
affinity: {}

slack:
  # -- (bool) Whether to create a Slack webhook Secret and inject the URL into the operator.
  enabled: false
  # -- (string) Slack Incoming Webhook URL.
  webhookUrl: ""

grafanaAnnotation:
  # -- (bool) Whether to record each upgrade phase as a Grafana annotation. Needs `url` and a token; if either is missing the operator logs a warning and runs with annotating disabled.
  enabled: false
  # -- (string) Grafana base URL. The operator appends `/api/annotations`.
  url: "http://grafana.monitoring:3000"
  # -- (list) Base tags merged into every annotation. Dashboards subscribe to these.
  tags:
    - event:eks-upgrade
  # -- (string) Which runs to annotate. One of `all`, `upgrade` (live upgrades only), or `dryRun`.
  annotateOn: "all"
  # -- (string) Grafana service account token, which needs the `annotations:create` permission. Ignored when existingSecret is set. Stored in a generated Secret and injected as `GRAFANA_API_TOKEN`, never logged. For production prefer existingSecret.
  apiToken: ""
  # -- (string) Name of a Secret you manage that holds the Grafana token. Takes precedence over apiToken. Point this at the `spec.target.name` of an ExternalSecret declared in `extraObjects` to source the token from AWS Secrets Manager or SSM.
  existingSecret: ""
  # -- (string) Key holding the token, within existingSecret or whichever Secret the chart generates.
  existingSecretKey: "token"
  # -- (object) Annotations to add to the Secret the chart generates from apiToken. Has no effect when existingSecret is set, since the chart does not own that Secret. Use for `helm.sh/resource-policy: keep`, or for Secret replication annotations such as reflector's.
  secretAnnotations: {}

# -- (list) EKSUpgrade custom resources to create. Each entry creates an EKSUpgrade CR that the operator will reconcile.
eksUpgrades: []
