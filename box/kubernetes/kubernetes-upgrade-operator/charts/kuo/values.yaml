    #       expr: |
    #         (
    #           sum by (cluster_name, region) (rate(kuo_reconcile_total{result="error"}[5m]))
    #           /
    #           sum by (cluster_name, region) (rate(kuo_reconcile_total[5m]))
    #         ) > 0.5
    #       for: 10m
    #       labels:
    #         severity: warning
    #       annotations:
    #         summary: "High reconcile error rate for {{ $labels.cluster_name }}"
    #         description: "Reconcile error rate for cluster {{ $labels.cluster_name }} exceeds 50% over 10 minutes."
    #     - alert: KuoUpgradeStuck
    #       expr: |
    #         kuo_upgrade_phase_info{phase=~"UpgradingControlPlane|UpgradingAddons|UpgradingNodeGroups"} == 1
    #       for: 60m
    #       labels:
