<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6e6e"/>
    </marker>
  </defs>

  <rect width="1040" height="470" fill="#0a0a0a"/>

  <!-- kubernetes cluster boundary -->
  <g>
    <rect x="170" y="24" width="846" height="422" rx="8" fill="#0e0e0e" stroke="#3a3a3a" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="186" y="44" fill="#6e6e6e" font-size="11">Kubernetes cluster</text>
  </g>

  <!-- flows -->
  <g stroke="#6e6e6e" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
    <path d="M 124 218 H 196"/>
    <path d="M 300 138 V 196"/>
    <path d="M 300 330 V 268"/>
    <path d="M 610 124 V 196"/>
    <path d="M 400 232 H 506"/>
    <path d="M 710 232 H 786"/>
    <path d="M 880 264 V 326"/>
  </g>

  <g fill="#8b8b8b" font-size="11">
    <text x="160" y="209" text-anchor="middle">socket</text>
    <text x="310" y="172">webhook POST /alert</text>
    <text x="310" y="306">env at boot</text>
    <text x="620" y="164">watched, translated</text>
    <text x="453" y="222" text-anchor="middle">A2A message/send</text>
    <text x="453" y="248" text-anchor="middle">role: user</text>
    <text x="748" y="222" text-anchor="middle">runs</text>
    <text x="890" y="300">composes</text>
  </g>

  <!-- event sources -->
  <g stroke="#8b8b8b" stroke-width="1.4" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 66 203 h 32 a 4 4 0 0 1 4 4 v 15 a 4 4 0 0 1 -4 4 h -18 l -9 8 v -8 h -5 a 4 4 0 0 1 -4 -4 v -15 a 4 4 0 0 1 4 -4 z"/>
    <path d="M 290 121 h 20 c -3.5 -3.5 -3.5 -9 -3.5 -13 a 6.5 6.5 0 0 0 -13 0 c 0 4 0 9.5 -3.5 13 z"/>
    <path d="M 297 125 a 3 3 0 0 0 6 0"/>
  </g>
  <g text-anchor="middle">
    <text x="83" y="252" fill="#e8e8e8" font-size="13">Slack</text>
    <text x="83" y="268" fill="#7a7a7a" font-size="10.5">thread mention</text>
    <text x="300" y="80" fill="#e8e8e8" font-size="13">Alertmanager</text>
    <text x="300" y="96" fill="#7a7a7a" font-size="10.5">firing alert group</text>
  </g>

  <!-- nodes -->
  <g>
    <rect x="200" y="200" width="200" height="64" rx="6" fill="#141414" stroke="#3a3a3a"/>
    <text x="300" y="228" text-anchor="middle" fill="#e8e8e8" font-size="14">kagent-alert-bridge</text>
    <text x="300" y="248" text-anchor="middle" fill="#7a7a7a" font-size="10.5">alert payload + instructions</text>

    <rect x="200" y="330" width="200" height="52" rx="6" fill="#141414" stroke="#3a3a3a"/>
    <text x="300" y="352" text-anchor="middle" fill="#e8e8e8" font-size="13">ConfigMap</text>
    <text x="300" y="370" text-anchor="middle" fill="#7a7a7a" font-size="10.5">ANALYSIS_INSTRUCTIONS</text>

    <rect x="510" y="72" width="200" height="52" rx="6" fill="#141414" stroke="#3a3a3a"/>
    <text x="610" y="94" text-anchor="middle" fill="#e8e8e8" font-size="13">Agent CR</text>
    <text x="610" y="112" text-anchor="middle" fill="#7a7a7a" font-size="10.5">declarative.systemMessage</text>

    <rect x="510" y="200" width="200" height="64" rx="6" fill="#141414" stroke="#3a3a3a"/>
    <text x="610" y="228" text-anchor="middle" fill="#e8e8e8" font-size="14">kagent controller</text>
    <text x="610" y="248" text-anchor="middle" fill="#7a7a7a" font-size="10.5">systemMessage → Instruction</text>

    <rect x="790" y="200" width="180" height="64" rx="6" fill="#141414" stroke="#3a3a3a"/>
    <text x="880" y="228" text-anchor="middle" fill="#e8e8e8" font-size="14">agent runtime</text>
    <text x="880" y="248" text-anchor="middle" fill="#7a7a7a" font-size="10.5">ADK task</text>

    <rect x="510" y="330" width="450" height="88" rx="6" fill="#101010" stroke="#2e2e2e"/>
    <text x="530" y="356" fill="#bdbdbd" font-size="13">model request</text>
    <g font-size="11">
      <text x="550" y="380" fill="#8b8b8b">system</text>
      <text x="620" y="380" fill="#6e6e6e">← Agent CR systemMessage</text>
      <text x="550" y="400" fill="#8b8b8b">user</text>
      <text x="620" y="400" fill="#6e6e6e">← alert payload + ANALYSIS_INSTRUCTIONS</text>
    </g>
  </g>
</svg>
