<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6e6e"/>
    </marker>
  </defs>

  <rect width="880" height="440" fill="#0a0a0a"/>

  <!-- kubernetes cluster boundary -->
  <g>
    <rect x="24" y="170" width="832" height="250" rx="8" fill="#0e0e0e" stroke="#3a3a3a" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="40" y="190" fill="#6e6e6e" font-size="11">Kubernetes cluster</text>
  </g>

  <!-- flows -->
  <g stroke="#6e6e6e" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
    <path d="M 220 70 H 332"/>
    <path d="M 380 96 V 196"/>
    <path d="M 470 200 V 100"/>
    <path d="M 540 228 H 676"/>
    <path d="M 760 256 V 326"/>
  </g>
  <g stroke="#4a4a4a" stroke-width="1.2" fill="none" stroke-dasharray="4 4" marker-end="url(#arrow)">
    <path d="M 220 228 H 296"/>
  </g>

  <g fill="#8b8b8b" font-size="11">
    <text x="280" y="60" text-anchor="middle">thread mention</text>
    <text x="370" y="132" text-anchor="end">app mention envelope,</text>
    <text x="370" y="148" text-anchor="end">envelope ack</text>
    <text x="480" y="132">working reaction,</text>
    <text x="480" y="148">thread reply</text>
    <text x="608" y="210" text-anchor="middle">A2A send, poll</text>
    <text x="768" y="296">runs turn</text>
  </g>

  <!-- protocol badges -->
  <g font-size="10" text-anchor="middle">
    <rect x="362" y="104" width="36" height="16" rx="8" fill="#141414" stroke="#3a3a3a"/>
    <text x="380" y="115" fill="#8b8b8b">wss</text>

    <rect x="448" y="104" width="44" height="16" rx="8" fill="#141414" stroke="#3a3a3a"/>
    <text x="470" y="115" fill="#8b8b8b">https</text>

    <rect x="590" y="220" width="36" height="16" rx="8" fill="#141414" stroke="#3a3a3a"/>
    <text x="608" y="231" fill="#8b8b8b">http</text>
  </g>

  <!-- nodes -->
  <g>
    <rect x="40" y="44" width="180" height="52" rx="6" fill="#141414" stroke="#3a3a3a"/>
    <text x="130" y="76" text-anchor="middle" fill="#e8e8e8" font-size="14">Engineer</text>

    <rect x="340" y="44" width="200" height="52" rx="6" fill="#141414" stroke="#3a3a3a"/>
    <text x="440" y="76" text-anchor="middle" fill="#e8e8e8" font-size="14">Slack</text>

    <rect x="40" y="200" width="180" height="56" rx="6" fill="#141414" stroke="#3a3a3a"/>
    <text x="130" y="232" text-anchor="middle" fill="#e8e8e8" font-size="14">Alertmanager</text>
    <text x="130" y="276" text-anchor="middle" fill="#7a7a7a" font-size="11">existing alert path</text>

    <rect x="300" y="200" width="240" height="56" rx="6" fill="#0d1b2a" stroke="#58a6ff" stroke-width="1.6"/>
    <text x="420" y="232" text-anchor="middle" fill="#cfe6ff" font-size="14">kagent-alert-bridge</text>

    <g fill="#6e8ba6" font-size="11" text-anchor="middle">
      <text x="420" y="292">socket loop, ack within 3s</text>
      <text x="420" y="308">drop self mentions and subtypes</text>
      <text x="420" y="324">thread ts to A2A contextId</text>
      <text x="420" y="340">own concurrency slots and deadline</text>
    </g>

    <rect x="680" y="200" width="160" height="56" rx="6" fill="#141414" stroke="#3a3a3a"/>
    <text x="760" y="232" text-anchor="middle" fill="#e8e8e8" font-size="14">kagent controller</text>

    <rect x="680" y="330" width="160" height="52" rx="6" fill="#141414" stroke="#3a3a3a"/>
    <text x="760" y="362" text-anchor="middle" fill="#e8e8e8" font-size="14">Agent and tools</text>
  </g>

  <text x="44" y="406" fill="#6e6e6e" font-size="11">Socket Mode: outbound wss only, no ingress and no signing secret</text>
</svg>
