apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kagent-alert-bridge.fullname" . }}
  labels:
    {{- include "kagent-alert-bridge.labels" . | nindent 4 }}
data:
  SLACK_API_URL: {{ .Values.slack.apiURL | quote }}
  SLACK_DEFAULT_CHANNEL: {{ required "slack.defaultChannel is required" .Values.slack.defaultChannel | quote }}
  SLACK_CHANNEL_LABEL: {{ .Values.slack.channelLabel | quote }}
  SLACK_CHANNEL_MAP: {{ include "kagent-alert-bridge.channelMap" . | quote }}
  SLACK_MAX_TEXT: {{ .Values.slack.maxTextLength | quote }}
  SLACK_PARENT_MODE: {{ .Values.slack.parentMode | quote }}
  SLACK_LOOKUP_WINDOW: {{ .Values.slack.lookupWindow | quote }}
  SLACK_LOOKUP_ATTEMPTS: {{ .Values.slack.lookupAttempts | quote }}
  SLACK_INVESTIGATING_REACTION: {{ .Values.slack.investigatingReaction | quote }}
  SLACK_COMPLETED_REACTION: {{ .Values.slack.completedReaction | quote }}
  KAGENT_URL: {{ .Values.kagent.url | quote }}
  KAGENT_NAMESPACE: {{ .Values.kagent.namespace | quote }}
  KAGENT_AGENT: {{ .Values.kagent.agent | quote }}
  KAGENT_AGENT_ROUTING_LABEL: {{ default .Values.slack.channelLabel .Values.kagent.agentRoutingLabel | quote }}
  KAGENT_AGENT_ROUTING_MAP: {{ include "kagent-alert-bridge.agentRoutingMap" . | quote }}
  KAGENT_USER_ID: {{ .Values.kagent.userID | quote }}
  KAGENT_TIMEOUT: {{ .Values.kagent.timeout | quote }}
  KAGENT_REQUEST_TIMEOUT: {{ .Values.kagent.requestTimeout | quote }}
  KAGENT_POLL_INTERVAL: {{ .Values.kagent.pollInterval | quote }}
  ANALYZE_SEVERITIES: {{ .Values.analysis.severities | quote }}
  ANALYZE_LABEL: {{ .Values.analysis.label | quote }}
  ANALYZE_RESOLVED: {{ .Values.analysis.resolved | quote }}
  DEDUPE_TTL: {{ .Values.analysis.dedupeTTL | quote }}
  MAX_ALERTS_IN_PROMPT: {{ .Values.analysis.maxAlerts | quote }}
  MAX_CONCURRENT_ANALYSES: {{ .Values.analysis.maxConcurrent | quote }}
  {{- with .Values.analysis.instructions }}
  ANALYSIS_INSTRUCTIONS: {{ . | quote }}
  {{- end }}
  {{- if .Values.chat.enabled }}
  CHAT_AGENT: {{ default .Values.kagent.agent .Values.chat.agent | quote }}
  CHAT_AGENT_MAP: {{ include "kagent-alert-bridge.chatAgentMap" . | quote }}
  CHAT_CHANNELS: {{ join "," .Values.chat.channels | quote }}
  CHAT_ALLOWED_USERS: {{ join "," .Values.chat.allowedUsers | quote }}
  CHAT_TIMEOUT: {{ .Values.chat.timeout | quote }}
  CHAT_SESSION_TTL: {{ .Values.chat.sessionTTL | quote }}
  CHAT_STATUS_INTERVAL: {{ .Values.chat.statusInterval | quote }}
  MAX_CONCURRENT_CHATS: {{ .Values.chat.maxConcurrent | quote }}
  {{- with .Values.chat.instructions }}
  CHAT_INSTRUCTIONS: {{ . | quote }}
  {{- end }}
  {{- /*
  The hints are three-valued: unset keeps the built-in text, and an explicitly
  empty value turns that one hint off. Emitting the key unconditionally would
  collapse the first case into the second.
  */}}
  {{- if not (kindIs "invalid" .Values.chat.threadHint) }}
  CHAT_THREAD_HINT: {{ .Values.chat.threadHint | quote }}
  {{- end }}
  {{- if not (kindIs "invalid" .Values.chat.deniedHint) }}
  CHAT_DENIED_HINT: {{ .Values.chat.deniedHint | quote }}
  {{- end }}
  {{- end }}
  WEBHOOK_PATH: {{ .Values.webhook.path | quote }}
  LISTEN_PORT: {{ .Values.ports.http | quote }}
  METRICS_PORT: {{ .Values.ports.metrics | quote }}
  LOG_LEVEL: {{ .Values.log.level | quote }}
  LOG_FORMAT: {{ .Values.log.format | quote }}

{{/*
The binary reads the channel map and the agent routing table as flat key=value
lists, so the values maps are flattened here rather than shipping a second
config format to the container.
*/}}
{{- define "kagent-alert-bridge.channelMap" -}}
{{- $pairs := list -}}
{{- range $key := keys .Values.slack.channelMap | sortAlpha -}}
{{- $pairs = append $pairs (printf "%s=%s" $key (index $.Values.slack.channelMap $key)) -}}
{{- end -}}
{{- join "," $pairs -}}
{{- end -}}

{{- define "kagent-alert-bridge.agentRoutingMap" -}}
{{- $pairs := list -}}
{{- range $key := keys .Values.kagent.agentRoutingMap | sortAlpha -}}
{{- $pairs = append $pairs (printf "%s=%s" $key (index $.Values.kagent.agentRoutingMap $key)) -}}
{{- end -}}
{{- join "," $pairs -}}
{{- end -}}

{{- define "kagent-alert-bridge.chatAgentMap" -}}
{{- $pairs := list -}}
{{- range $key := keys .Values.chat.agentMap | sortAlpha -}}
{{- $pairs = append $pairs (printf "%s=%s" $key (index $.Values.chat.agentMap $key)) -}}
{{- end -}}
{{- join "," $pairs -}}
{{- end -}}
