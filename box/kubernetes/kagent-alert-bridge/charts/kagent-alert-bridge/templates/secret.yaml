{{- if not .Values.slack.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kagent-alert-bridge.slackSecretName" . }}
  labels:
    {{- include "kagent-alert-bridge.labels" . | nindent 4 }}
type: Opaque
stringData:
  SLACK_BOT_TOKEN: {{ required "slack.token is required when slack.existingSecret is empty" .Values.slack.token | quote }}
{{- end }}
{{- if and (not .Values.webhook.existingSecret) .Values.webhook.token }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kagent-alert-bridge.webhookSecretName" . }}
  labels:
    {{- include "kagent-alert-bridge.labels" . | nindent 4 }}
type: Opaque
stringData:
  WEBHOOK_BEARER_TOKEN: {{ .Values.webhook.token | quote }}
{{- end }}
