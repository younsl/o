image:
  # -- (string) Container image registry
  registry: ghcr.io/younsl
  # -- (string) Container image repository
  repository: kagent-alert-bridge
  # -- (string) Image tag; defaults to the chart appVersion when empty
  tag: ""
  # -- (string) Image pull policy
  pullPolicy: IfNotPresent

# -- (list) Image pull secrets for private registries
imagePullSecrets: []
# -- (string) Override the chart name
nameOverride: ""
# -- (string) Override the fully qualified release name
fullnameOverride: ""

# -- (int) Number of replicas. Each replica keeps its own in-memory deduplication state, so more than one replica can analyse the same alert group twice.
replicaCount: 1

# -- (int) Number of old ReplicaSets to retain for rollback
revisionHistoryLimit: 3

# -- (object) Deployment update strategy
strategy:
  type: RollingUpdate
  rollingUpdate:
    # -- (string|int) Max Pods created above desired count during an update
    maxSurge: 25%
    # -- (string|int) Max Pods unavailable during an update
    maxUnavailable: 25%

slack:
  # -- (string) How the thread parent is obtained. `lookup` leaves the alert notification to Alertmanager and finds it in channel history to reply under, which needs `channels:history` and `channels:read` (plus the `groups:*` equivalents for private channels). `post` makes the bridge publish the alert itself and needs only `chat:write`.
  parentMode: "lookup"
  # -- (string) How far back channel history is searched for the alert notification, as a Go duration. Only used in `lookup` mode.
  lookupWindow: "15m"
  # -- (int) How many times to re-search before giving up. Alertmanager delivers the Slack notification and the webhook independently, so the first attempt can miss. Only used in `lookup` mode.
  lookupAttempts: 3
  # -- (string) Emoji (without colons) placed on the alert notification while the agent investigates and removed when the analysis lands. Needs `reactions:write`. Empty string disables it.
  investigatingReaction: "telescope"
  # -- (string) Emoji (without colons) that replaces the investigating reaction once the analysis has been posted. Needs `reactions:write`. Empty string disables it.
  completedReaction: "white_check_mark"
  # -- (string) Channel used when the routing label is absent. A bare name is prefixed with #; a conversation ID is used as-is and skips the `channels:read` lookup.
  defaultChannel: ""
  # -- (string) Alert label that selects the destination channel
  channelLabel: "slack_channel"
  # -- (object) Mapping from routing label value to Slack channel, for labels whose value is not the channel name
  channelMap: {}
    # test-route: alerts-test
  # -- (int) Maximum characters posted in one message; longer text is truncated
  maxTextLength: 8000
  # -- (string) Slack Web API base URL; override to route through an egress proxy
  apiURL: "https://slack.com/api"
  # -- (string) Name of an existing Secret holding the bot token. Leave empty to create one from `slack.token`.
  existingSecret: ""
  # -- (string) Key inside the Secret holding the bot token
  existingSecretKey: "SLACK_BOT_TOKEN"
  # -- (string) Bot token (xoxb-...). Only used when `slack.existingSecret` is empty; prefer an externally managed Secret.
  token: ""

kagent:
  # -- (string) Base URL of the kagent controller; the A2A path is appended to it
  url: "http://kagent-controller.kagent:8083"
  # -- (string) Namespace holding the Agent resource
  namespace: "kagent"
  # -- (string) Name of the Agent resource used when the routing label is absent or names no mapped agent
  agent: "alert-triage-agent"
  # -- (string) Alert label that routes an alert to an agent. Defaults to `slack.channelLabel` when empty, so one label can split both the channel and the agent.
  agentRoutingLabel: ""
  # -- (object) Routing table from label value to the Agent resource that handles it, so one bridge can feed several specialised agents. Unlike `slack.channelMap` this is not an alias table: a value it does not carry falls back to `kagent.agent` instead of being used as an agent name.
  agentRoutingMap: {}
    # infra-alerts: aws-alert-triage-agent
    # security-alerts: security-alert-triage-agent
  # -- (string) Identity sent as X-User-Id, which owns the kagent sessions the bridge creates
  userID: "alert-bridge@kagent.dev"
  # -- (string) Deadline for one whole analysis (queueing, parent lookup, and the polled agent run), as a Go duration. On expiry the task is cancelled on the controller so it stops consuming model tokens.
  timeout: "120s"
  # -- (string) Timeout for a single HTTP call to the controller (submit, poll, or cancel), as a Go duration
  requestTimeout: "30s"
  # -- (string) Wait between two task status polls, as a Go duration
  pollInterval: "5s"

analysis:
  # -- (string) Comma-separated severities to analyse; empty analyses every alert
  severities: "critical"
  # -- (string) Alert label that opts a rule in ("true") or out ("false") regardless of severity
  label: "analyze"
  # -- (bool) Analyse resolved notifications as well as firing ones
  resolved: false
  # -- (string) How long a group stays suppressed after being analysed, as a Go duration. Should cover the Alertmanager repeat_interval. "0s" disables deduplication.
  dedupeTTL: "12h"
  # -- (int) Maximum alerts rendered into one prompt
  maxAlerts: 5
  # -- (int) Maximum analyses running at once, which bounds concurrent model spend
  maxConcurrent: 2
  # -- (string) Instructions appended to every prompt. Empty uses the built-in English instructions; override to change the output language or sections.
  instructions: ""

webhook:
  # -- (string) Path Alertmanager posts to
  path: "/alert"
  # -- (string) Name of an existing Secret holding the bearer token the webhook requires. Leave empty to create one from `webhook.token`.
  existingSecret: ""
  # -- (string) Key inside the Secret holding the bearer token
  existingSecretKey: "WEBHOOK_BEARER_TOKEN"
  # -- (string) Bearer token required on incoming webhooks. Empty disables authentication.
  token: ""

log:
  # -- (string) Log level: debug, info, warn, error
  level: "info"
  # -- (string) Log format: json or text
  format: "json"

# -- (list) Additional environment variables for the container (raw EnvVar entries)
extraEnv: []
  # - name: HTTPS_PROXY
  #   value: http://proxy.example.com:3128

# -- (list) Additional envFrom sources for the container (configMapRef/secretRef entries)
extraEnvFrom: []
  # - secretRef:
  #     name: extra-secret

ports:
  # -- (int) Port serving the webhook, /healthz and /readyz
  http: 8080
  # -- (int) Port serving Prometheus /metrics
  metrics: 8081

serviceAccount:
  # -- (bool) Create a ServiceAccount
  create: true
  # -- (string) ServiceAccount name; defaults to the chart fullname when empty
  name: ""
  # -- (object) ServiceAccount annotations
  annotations: {}
  # -- (bool) Automount the ServiceAccount token
  automountServiceAccountToken: false
  # -- (list) Image pull secrets attached to the ServiceAccount, injected into Pods that use it
  imagePullSecrets: []

service:
  # -- (bool) Create a Service exposing the webhook and metrics ports
  enabled: true
  # -- (string) Service type
  type: ClusterIP
  # -- (string) Traffic distribution preference, e.g. PreferClose (requires Kubernetes 1.31+); empty omits the field
  trafficDistribution: ""

serviceMonitor:
  # -- (bool) Create a Prometheus Operator ServiceMonitor
  enabled: false
  # -- (string) Scrape interval
  interval: 30s
  # -- (string) Scrape timeout
  scrapeTimeout: 10s
  # -- (object) Extra labels for the ServiceMonitor
  labels: {}
  # -- When true, honorLabels preserves the metric's labels when they collide with the target's labels.
  honorLabels: false
  # -- Prometheus [RelabelConfigs] to apply to samples before scraping
  relabelings: []
  # -- Prometheus [MetricRelabelConfigs] to apply to samples before ingestion
  metricRelabelings: []

# -- (object) Pod resource requests and limits
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 128Mi

# -- (list) Container resize policy for in-place vertical scaling (requires Kubernetes 1.27+); empty omits the field. CPU resizes in place without a restart; memory resizes restart the container.
resizePolicy:
  - resourceName: cpu
    restartPolicy: NotRequired
  - resourceName: memory
    restartPolicy: RestartContainer

# -- (int) Grace period for shutdown. Must exceed `kagent.timeout` plus the 30s drain margin so an analysis already running still posts its thread reply.
terminationGracePeriodSeconds: 180

# -- (object) Extra annotations for the pod
podAnnotations: {}
# -- (object) Extra labels for the pod
podLabels: {}

# -- (object) Pod-level security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# -- (object) Container-level security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- (object) Node selector for pod scheduling
nodeSelector: {}
# -- (list) Tolerations for pod scheduling
tolerations: []
# -- (object) Affinity rules for pod scheduling
affinity: {}

# -- (string) Pod DNS policy, e.g. ClusterFirst or None; empty omits the field
dnsPolicy: ""
# -- (object) Pod DNS config (used with dnsPolicy None); empty omits the field
dnsConfig: {}

# -- (list) Additional Kubernetes manifests rendered verbatim
extraObjects: []
