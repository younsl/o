{{- if not .Values.slack.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aws-vpn-maintenance-handler.slackSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aws-vpn-maintenance-handler.labels" . | nindent 4 }}
type: Opaque
stringData:
  botToken: {{ required "slack.botToken is required unless slack.existingSecret is set" .Values.slack.botToken | quote }}
  appToken: {{ required "slack.appToken is required unless slack.existingSecret is set" .Values.slack.appToken | quote }}
{{- end }}
