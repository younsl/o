apiVersion: v1
kind: Service
metadata:
  name: {{ include "aws-vpn-maintenance-handler.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aws-vpn-maintenance-handler.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.trafficDistribution }}
  trafficDistribution: {{ . }}
  {{- end }}
  ports:
    - name: metrics
      port: {{ .Values.metricsPort }}
      targetPort: metrics
      protocol: TCP
    - name: health
      port: {{ .Values.healthPort }}
      targetPort: health
      protocol: TCP
  selector:
    {{- include "aws-vpn-maintenance-handler.selectorLabels" . | nindent 4 }}
