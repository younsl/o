<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e6e6e"/>
    </marker>
  </defs>

  <rect width="880" height="420" fill="#0a0a0a"/>

  <!-- kubernetes cluster boundary -->
  <g>
    <rect x="24" y="148" width="832" height="264" rx="8" fill="#0e0e0e" stroke="#3a3a3a" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="40" y="168" fill="#6e6e6e" font-size="11">Kubernetes cluster</text>
  </g>

  <!-- flows -->
  <g stroke="#6e6e6e" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
    <path d="M 185 180 V 88 H 656"/>
    <path d="M 220 208 H 326"/>
    <path d="M 550 192 H 750 V 120"/>
    <path d="M 550 224 H 750 V 236"/>
    <path d="M 750 296 V 336"/>
  </g>

  <g fill="#8b8b8b" font-size="11">
    <text x="205" y="80">slack_configs (alert message)</text>
    <text x="273" y="200" text-anchor="middle">webhook</text>
    <text x="558" y="184">find parent, thread reply</text>
    <text x="558" y="216">A2A send, poll, cancel</text>
    <text x="762" y="322">runs task</text>
  </g>

  <!-- nodes -->
  <g>
    <rect x="40" y="180" width="180" height="56" rx="6" fill="#141414" stroke="#3a3a3a"/>
    <text x="130" y="212" text-anchor="middle" fill="#e8e8e8" font-size="14">Alertmanager</text>
    <text x="130" y="256" text-anchor="middle" fill="#7a7a7a" font-size="11">Prometheus or Mimir</text>

    <rect x="330" y="180" width="220" height="56" rx="6" fill="#0d1b2a" stroke="#58a6ff" stroke-width="1.6"/>
    <text x="440" y="212" text-anchor="middle" fill="#cfe6ff" font-size="14">kagent-gateway</text>

    <g fill="#6e8ba6" font-size="11" text-anchor="middle">
      <text x="440" y="256">filter by severity and label</text>
      <text x="440" y="272">dedupe per alert group</text>
      <text x="440" y="288">bound concurrent analyses</text>
      <text x="440" y="304">render prompt, post analysis</text>
    </g>

    <rect x="660" y="64" width="180" height="56" rx="6" fill="#141414" stroke="#3a3a3a"/>
    <text x="750" y="96" text-anchor="middle" fill="#e8e8e8" font-size="14">Slack</text>

    <rect x="660" y="240" width="180" height="56" rx="6" fill="#141414" stroke="#3a3a3a"/>
    <text x="750" y="272" text-anchor="middle" fill="#e8e8e8" font-size="14">kagent controller</text>

    <rect x="660" y="340" width="180" height="48" rx="6" fill="#101010" stroke="#2e2e2e"/>
    <text x="750" y="369" text-anchor="middle" fill="#bdbdbd" font-size="13">alert-triage-agent</text>
  </g>
</svg>
