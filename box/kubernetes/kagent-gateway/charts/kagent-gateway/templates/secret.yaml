{{- if not .Values.slack.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kagent-gateway.slackSecretName" . }}
  labels:
    {{- include "kagent-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  SLACK_BOT_TOKEN: {{ required "slack.token is required when slack.existingSecret is empty" .Values.slack.token | quote }}
  {{- if .Values.chat.enabled }}
  SLACK_APP_TOKEN: {{ required "slack.appToken is required when chat.enabled is true and slack.existingSecret is empty" .Values.slack.appToken | quote }}
  {{- end }}
{{- end }}
{{- if and (not .Values.webhook.existingSecret) .Values.webhook.token }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kagent-gateway.webhookSecretName" . }}
  labels:
    {{- include "kagent-gateway.labels" . | nindent 4 }}
type: Opaque
stringData:
  WEBHOOK_BEARER_TOKEN: {{ .Values.webhook.token | quote }}
{{- end }}
