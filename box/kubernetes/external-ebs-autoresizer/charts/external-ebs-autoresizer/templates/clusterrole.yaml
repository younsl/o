{{- if and .Values.rbac.create .Values.config.throughputRecommendation.enabled -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "external-ebs-autoresizer.fullname" . }}
  labels:
    {{- include "external-ebs-autoresizer.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs:
      - get
      - list
      - patch
  - apiGroups: [""]
    resources: ["events"]
    verbs:
      - create
      - patch
{{- end }}
