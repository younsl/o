<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" width="1040" height="660" role="img" aria-label="Kubernetes-perspective architecture of the EBS throughput recommendation flow">
  <!-- Styling is inline rather than in a <style> block: markdown renderers that
       sanitize embedded SVG strip <style>, which would leave this diagram as
       unreadable default-black text on a black background. -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e6e6e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="660" fill="#0a0a0a"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="24" y="28" font-size="14" fill="#f0f0f0">EBS throughput recommendation — Kubernetes view</text>
    <text x="24" y="46" font-size="10.5" fill="#6e6e6e">recommend only · no EBS mutation · annotations are the output</text>

    <!-- Kubernetes cluster -->
    <rect x="24" y="62" width="616" height="556" rx="4" fill="none" stroke="#3a3a3a" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="38" y="82" font-size="11" fill="#8a8a8a">Kubernetes cluster</text>

    <!-- namespace kube-system -->
    <rect x="48" y="94" width="568" height="140" rx="3" fill="none" stroke="#3a3a3a" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="60" y="112" font-size="10.5" fill="#8a8a8a">namespace/kube-system</text>

    <rect x="68" y="124" width="300" height="98" rx="3" fill="#0f0f0f" stroke="#4a4a4a" stroke-width="1"/>
    <text x="82" y="146" font-size="11.5" fill="#d4d4d4">Deployment/external-ebs-autoresizer</text>
    <text x="82" y="167" font-size="10.5" fill="#8a8a8a">resizer loop        every 5m</text>
    <text x="82" y="184" font-size="10.5" fill="#8a8a8a">recommender loop    every 30m</text>
    <text x="82" y="207" font-size="10" fill="#6e6e6e">leader replica only (Lease)</text>

    <!-- Node objects -->
    <rect x="48" y="258" width="568" height="340" rx="3" fill="none" stroke="#3a3a3a" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="60" y="278" font-size="10.5" fill="#8a8a8a">Node (cluster-scoped)</text>

    <rect x="68" y="300" width="528" height="132" rx="3" fill="#0f0f0f" stroke="#4a4a4a" stroke-width="1"/>
    <text x="82" y="322" font-size="11.5" fill="#d4d4d4">Node/ip-10-0-1-5</text>
    <text x="230" y="322" font-size="10" fill="#6e6e6e">m5.4xlarge · 1 gp3 volume · node-exporter :9100</text>
    <text x="82" y="346" font-size="10" fill="#8a8a8a">annotations</text>
    <text x="82" y="366" font-size="10" fill="#8a8a8a">external-ebs-autoresizer/throughput-recommendation</text>
    <text x="412" y="366" font-size="10" fill="#d4d4d4">increase</text>
    <text x="82" y="384" font-size="10" fill="#8a8a8a">external-ebs-autoresizer/throughput-current-mibps</text>
    <text x="412" y="384" font-size="10" fill="#d4d4d4">125</text>
    <text x="82" y="402" font-size="10" fill="#8a8a8a">external-ebs-autoresizer/throughput-recommended-mibps</text>
    <text x="412" y="402" font-size="10" fill="#d4d4d4">375</text>
    <text x="82" y="420" font-size="10" fill="#8a8a8a">external-ebs-autoresizer/iops-recommended</text>
    <text x="412" y="420" font-size="10" fill="#d4d4d4">3000</text>

    <rect x="68" y="450" width="528" height="132" rx="3" fill="#0f0f0f" stroke="#4a4a4a" stroke-width="1"/>
    <text x="82" y="472" font-size="11.5" fill="#d4d4d4">Node/ip-10-0-2-7</text>
    <text x="230" y="472" font-size="10" fill="#6e6e6e">m5.large · 1 gp3 volume · node-exporter :9100</text>
    <text x="82" y="496" font-size="10" fill="#8a8a8a">annotations</text>
    <text x="82" y="516" font-size="10" fill="#8a8a8a">external-ebs-autoresizer/throughput-recommendation</text>
    <text x="412" y="516" font-size="10" fill="#d4d4d4">increase</text>
    <text x="82" y="534" font-size="10" fill="#8a8a8a">external-ebs-autoresizer/throughput-recommended-mibps</text>
    <text x="412" y="534" font-size="10" fill="#d4d4d4">566</text>
    <text x="82" y="552" font-size="10" fill="#8a8a8a">external-ebs-autoresizer/throughput-recommendation-reason</text>
    <text x="100" y="570" font-size="10" fill="#d4d4d4">clamped_to_instance_bandwidth</text>

    <!-- Metrics backend -->
    <rect x="712" y="96" width="304" height="112" rx="3" fill="#0f0f0f" stroke="#4a4a4a" stroke-width="1"/>
    <text x="726" y="120" font-size="11.5" fill="#d4d4d4">Prometheus  or  Grafana Mimir</text>
    <text x="726" y="144" font-size="10.5" fill="#8a8a8a">POST /api/v1/query</text>
    <text x="726" y="162" font-size="10.5" fill="#8a8a8a">/prometheus prefix auto-probed</text>
    <text x="726" y="180" font-size="10.5" fill="#8a8a8a">X-Scope-OrgID when multi-tenant</text>
    <text x="726" y="198" font-size="10" fill="#6e6e6e">node_disk_{read,written}_bytes_total</text>

    <!-- AWS -->
    <rect x="712" y="252" width="304" height="112" rx="3" fill="#0f0f0f" stroke="#4a4a4a" stroke-width="1"/>
    <text x="726" y="276" font-size="11.5" fill="#d4d4d4">AWS EC2 + EBS</text>
    <text x="866" y="276" font-size="10" fill="#6e6e6e">read-only</text>
    <text x="726" y="300" font-size="10.5" fill="#8a8a8a">DescribeVolumes</text>
    <text x="726" y="318" font-size="10.5" fill="#8a8a8a">DescribeInstanceTypes (cached)</text>
    <text x="726" y="342" font-size="10" fill="#6e6e6e">no ModifyVolume on this path</text>

    <!-- Operator -->
    <rect x="712" y="470" width="304" height="112" rx="3" fill="#0f0f0f" stroke="#4a4a4a" stroke-width="1"/>
    <text x="726" y="494" font-size="11.5" fill="#d4d4d4">Operator</text>
    <text x="726" y="518" font-size="10.5" fill="#8a8a8a">kubectl get nodes -o custom-columns</text>
    <text x="726" y="536" font-size="10.5" fill="#8a8a8a">Grafana / recommendation_total</text>
    <text x="726" y="560" font-size="10" fill="#6e6e6e">decides whether to apply</text>

    <!-- query -->
    <path d="M368,146 H712" fill="none" stroke="#6e6e6e" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="452" y="126" width="186" height="14" fill="#0a0a0a"/>
    <text x="456" y="137" font-size="10" fill="#a8a8a8">instant query ×2 (p99, samples)</text>

    <!-- describe -->
    <path d="M368,190 H676 V292 H712" fill="none" stroke="#6e6e6e" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="470" y="170" width="150" height="14" fill="#0a0a0a"/>
    <text x="474" y="181" font-size="10" fill="#a8a8a8">describe volume + caps</text>

    <!-- annotate -->
    <path d="M330,222 V300" fill="none" stroke="#6e6e6e" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="338" y="248" width="160" height="14" fill="#0a0a0a"/>
    <text x="342" y="259" font-size="10" fill="#a8a8a8">merge-patch annotations</text>

    <!-- scrape -->
    <path d="M760,208 V228 H656 V340 H596" fill="none" stroke="#6e6e6e" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="666" y="220" width="86" height="14" fill="#0a0a0a"/>
    <text x="670" y="231" font-size="10" fill="#a8a8a8">scrape 15s</text>

    <!-- read -->
    <path d="M712,516 H596" fill="none" stroke="#6e6e6e" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="608" y="496" width="106" height="14" fill="#0a0a0a"/>
    <text x="612" y="507" font-size="10" fill="#a8a8a8">read annotations</text>

    <text x="24" y="634" font-size="10" fill="#6e6e6e">peak   = quantile_over_time(0.99, sum by (node) (rate(read_bytes)+rate(written_bytes))[7d:1m]) / 1 MiB</text>
    <text x="24" y="650" font-size="10" fill="#6e6e6e">target = ceil(peak × 1.3) rounded to a 125 MiB/s step, clamped by the gp3 maximum and the instance EBS bandwidth</text>
  </g>
</svg>
